<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>موقع متغير جديد</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; }
    </style>
</head>
<body>

    <h1 id="greeting">أهلاً بك!</h1>

    <script>
        const date = new Date();
        const hours = date.getHours();
        const greetingElement = document.getElementById("greeting");

        if (hours < 12) {
            greetingElement.textContent = " أحمد صباح الخير يا عزيزي! يومك سعيد ياعم.";
        } else if (hours < 18) {
            greetingElement.textContent = "مساء الخير! أتمنى لك وقتاً طيباً.";
        } else {
            greetingElement.textContent = "ليلة سعيدة! وقت النوم اقترب.";
        }
    </script>

</body>
</html>
