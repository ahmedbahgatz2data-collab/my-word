<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تحديث الكلمة لجميع الزوار</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f6f9; }
        .container { background: white; padding: 30px; border-radius: 10px; display: inline-block; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); }
        input { padding: 10px; font-size: 16px; width: 250px; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 10px 20px; font-size: 16px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; margin-right: 5px; }
        button:hover { background-color: #0056b3; }
        #result { margin-top: 30px; font-size: 32px; color: #dc3545; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>اكتب كلمة لتظهر لجميع الزوار فوراً:</h2>
    <input type="text" id="myInput" placeholder="اكتب الكلمة هنا...">
    <button onclick="updateGlobalText()">تحديث عند الجميع</button>

    <div id="result">جاري الاتصال بقاعدة البيانات...</div>
</div>

<!-- استدعاء مكتبات Firebase المستقرة لقراءة البيانات فورياً -->
<script src="https://gstatic.com"></script>
<script src="https://gstatic.com"></script>

<script>
    // الإعدادات الخاصة بمشروعك بعد دمج رابط قاعدة البيانات المشتركة
    const firebaseConfig = {
      apiKey: "AIzaSyCUITiTFisvyy5pgT-MtYqJKF5U5lG5AfE",
      authDomain: "word-sync-3a6c9.firebaseapp.com",
      databaseURL: "https://firebaseio.com", // السطر المضاف للربط بقاعدة البيانات المشتركة
      projectId: "word-sync-3a6c9",
      storageBucket: "word-sync-3a6c9.firebasestorage.app",
      messagingSenderId: "456953795615",
      appId: "1:456953795615:web:f4561dbe053b88be42312a",
      measurementId: "G-TX69BFG6L5"
    };
    
    // تشغيل نظام الـ Firebase
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // 1. الاستماع الفوري للتغيرات وعرض الكلمة الحالية لجميع الزوار في نفس اللحظة
    database.ref('sharedWord').on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
            document.getElementById("result").innerText = data;
        } else {
            document.getElementById("result").innerText = "لا توجد كلمة مشتركة بعد.";
        }
    });

    // 2. دالة إرسال الكلمة الجديدة للجميع وتحديث الـ Database
    function updateGlobalText() {
        let inputText = document.getElementById("myInput").value;
        
        if (inputText.trim() !== "") {
            database.ref('sharedWord').set(inputText); // تعديل النص في السيرفر ليتحدث لدى الجميع
            document.getElementById("myInput").value = ""; // تفريغ الصندوق
        } else {
            alert("من فضلك اكتب كلمة أولاً.");
        }
    }
</script>

</body>
</html>
