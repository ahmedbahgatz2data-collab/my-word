<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>Dynamic Greeting Website For testing</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            padding: 50px; 
            transition: background 0.5s, color 0.5s; 
        }
        /* Morning styles */
        .morning { background-color: #f0f8ff; color: #333; }
        /* Evening styles */
        .evening { background-color: #fff8dc; color: #333; }
        /* Night styles */
        .night { background-color: #2c3e50; color: #ecf0f1; }
    </style>
</head>
<body>

    <h1 id="greeting">Welcome!</h1>

    <script>
        const date = new Date();
        const hours = date.getHours();
        const greetingElement = document.getElementById("greeting");
        const bodyElement = document.body;

        if (hours < 12) {
            greetingElement.textContent = "Good morning Dear, dear! Have a great day, Mr. Ahmed R.";
            bodyElement.className = "morning";
        } else if (hours < 18) {
            greetingElement.textContent = "Good afternoon sir! Hope you are having a wonderful time.";
            bodyElement.className = "evening";
        } else {
            greetingElement.textContent = "Good night sir! It is almost time to sleep.";
            bodyElement.className = "night";
        }
    </script>

</body>
</html>
