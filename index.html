<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تثبيت النصوص في الصفحة</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f9f9f9;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            display: inline-block;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
        }
        input {
            padding: 10px;
            font-size: 16px;
            width: 250px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 5px;
        }
        button:hover {
            background-color: #218838;
        }
        #result {
            margin-top: 30px;
            font-size: 28px;
            color: #0056b3;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>اكتب الكلمة المراد تثبيتها:</h2>
    
    <!-- صندوق الإدخال والزر -->
    <input type="text" id="myInput" placeholder="اكتب الكلمة هنا...">
    <button onclick="saveText()">تثبيت الكلمة</button>

    <!-- مكان عرض الكلمة الثابتة -->
    <div id="result"></div>
</div>

<script>
    // هذه الدالة تعمل تلقائيًا فور فتح الصفحة للتحقق من وجود كلمة محفوظة مسبقًا
    window.onload = function() {
        let savedText = localStorage.getItem("fixedWord");
        if (savedText) {
            document.getElementById("result").innerText = savedText;
        } else {
            document.getElementById("result").innerText = "لا توجد كلمة مثبتة بعد.";
        }
    };

    // دالة حفظ وتغيير الكلمة
    function saveText() {
        let inputText = document.getElementById("myInput").value;
        
        if (inputText.trim() !== "") {
            // 1. حفظ الكلمة في ذاكرة المتصفح
            localStorage.setItem("fixedWord", inputText);
            
            // 2. عرض الكلمة فورًا في الصفحة
            document.getElementById("result").innerText = inputText;
            
            // 3. تفريغ صندوق الإدخال بعد الحفظ
            document.getElementById("myInput").value = "";
        } else {
            alert("من فضلك اكتب كلمة أولاً قبل الضغط على التثبيت.");
        }
    }
</script>

</body>
</html>
